<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Welcome to the interactive Reveal whats the animal UI.</h1>
      <h1>Click on the button to reveal the animal.</h1>
    </header>

    <main>
      <section class="animal-card-grid">
        <article class="animal-card" id="catContainer" hidden>
          <img
            id="catImage"
            class="animal-image"
            src="images/tabby-cat.jpg"
            alt="cat image"
          />
          <button type="button" class="btn_hide" id="hide_Button">Hide Result</button>
        </article>

        <article class="animal-card" id="dogContainer" hidden>
          <img
            id="dogImage"
            class="animal-image"
            src="images/dog.jpg"
            alt="dog image"
          />
          <button type="button" class="btn_hide" id="hide_Button">Hide Result</button>
        </article>

        <article class="animal-card" id="cowContainer" hidden>
          <img
            id="cowImage"
            class="animal-image"
            src="images/cow.jpg"
            alt="cow image"
          />
          <button type="button" class="btn_hide" id="hide_Button">Hide Result</button>
        </article>
      </section>

      <div class="button-group">
        <button class="btn_reveal" id="reveal_CatButton">Reveal a cat</button>
        <button class="btn_reveal" id="reveal_DogButton">Reveal a dog</button>
        <button class="btn_reveal" id="reveal_CowButton">Reveal a cow</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
